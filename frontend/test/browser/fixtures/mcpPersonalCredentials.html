<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>MCP 个人凭证测试</title></head>
<body>
<div id="app" style="max-width:1100px;margin:40px auto;padding:24px"></div>
<script type="module">
import { createApp, h } from 'vue'
import { createPinia } from 'pinia'
import { createRouter, createMemoryHistory, RouterView } from 'vue-router'
import Antd, { ConfigProvider } from 'ant-design-vue'
import { useThemeStore } from '../../../src/shared/model/theme.js'
import { useUserStore } from '../../../src/modules/identity/model/user.js'
import McpCardList from '../../../src/modules/extensions/ui/McpCardList.vue'
import '../../../src/assets/css/main.css'
const pinia = createPinia()
const router = createRouter({ history: createMemoryHistory(), routes: [{ path: '/', component: McpCardList }] })
let theme
const app = createApp({ render: () => h(ConfigProvider, { theme: theme.currentTheme }, { default: () => h(RouterView) }) })
app.use(pinia).use(router).use(Antd)
const user = useUserStore()
Object.assign(user, { token: 'mcp-browser-fixture', uid: 'fixture-alice', username: 'Alice', userRole: 'user' })
theme = useThemeStore()
theme.setTheme('light')
window.mcpFixture = { user, theme }
await router.isReady()
app.mount('#app')
</script>
</body>
</html>
