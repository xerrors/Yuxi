x-api-worker-env: &api-worker-env
  HOST_IP: ${HOST_IP:-}
  YUXI_KNOWLEDGE_ENABLED: ${YUXI_KNOWLEDGE_ENABLED:-true}
  RUNNING_IN_DOCKER: "true"
  YUXI_ENV: development
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env, or rerun `bash scripts/init.sh`.}
  YUXI_INSTANCE_ID: ${YUXI_INSTANCE_ID:?Set YUXI_INSTANCE_ID in .env, or rerun `bash scripts/init.sh`.}
  API_KEY_DERIVATION_SECRET: ${API_KEY_DERIVATION_SECRET:?Set API_KEY_DERIVATION_SECRET in .env [v0.7.2+], or rerun `bash scripts/init.sh`.}
  RAPIDOCR_MODEL_DIR: /home/yuxi/.cache/rapidocr/models
  # DBs and other services
  POSTGRES_URL: ${POSTGRES_URL:-postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-yuxi}}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  NEO4J_URI: ${NEO4J_URI:-bolt://graph:7687}
  NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:-0123456789}
  MILVUS_URI: ${MILVUS_URI:-http://milvus:19530}
  MILVUS_TOKEN: ${MILVUS_TOKEN:-}
  MILVUS_DB: ${MILVUS_DB:-yuxi}
  MINIO_URI: ${MINIO_URI:-http://minio:9000}
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
  # 文档解析
  MINERU_API_URI: ${MINERU_API_URI:-http://mineru-api:30001}
  PADDLEX_URI: ${PADDLEX_URI:-}
  # 沙盒后端：cube 使用执行节点 VM，container 使用独立 runner 的临时容器
  SANDBOX_BACKEND: ${SANDBOX_BACKEND:-container}
  SANDBOX_RUNNER_URL: ${SANDBOX_RUNNER_URL:-http://sandbox-runner:8090}
  SANDBOX_RUNNER_TOKEN: ${SANDBOX_RUNNER_TOKEN:-}
  # 固定用户 Cube 环境，文件与 Skills 共享节点本地目录
  CUBE_API_URL: ${CUBE_API_URL:-}
  CUBE_API_KEY: ${CUBE_API_KEY:-}
  CUBE_PROXY_NODE_IP: ${CUBE_PROXY_NODE_IP:-}
  CUBE_PROXY_PORT_HTTP: ${CUBE_PROXY_PORT_HTTP:-80}
  CUBE_TEMPLATE_ID: ${CUBE_TEMPLATE_ID:-yuxi-user}
  CUBE_NODE_USER_DATA_DIR: ${CUBE_NODE_USER_DATA_DIR:-/data/shared/yuxi/threads}
  CUBE_NODE_SKILL_PROJECTION_DIR: ${CUBE_NODE_SKILL_PROJECTION_DIR:-/data/shared/yuxi/skill-projections}
  SANDBOX_IDLE_SECONDS: ${SANDBOX_IDLE_SECONDS:-300}
  SANDBOX_EXEC_TIMEOUT_SECONDS: ${SANDBOX_EXEC_TIMEOUT_SECONDS:-180}
  SANDBOX_MAX_OUTPUT_BYTES: ${SANDBOX_MAX_OUTPUT_BYTES:-262144}
  BACKGROUND_JOB_DEFAULT_TIMEOUT_SECONDS: ${BACKGROUND_JOB_DEFAULT_TIMEOUT_SECONDS:-86400}
  # Agent run
  RUN_CANCEL_KEY_TTL_SECONDS: ${RUN_CANCEL_KEY_TTL_SECONDS:-1800}
  RUN_EVENTS_STREAM_TTL_SECONDS: ${RUN_EVENTS_STREAM_TTL_SECONDS:-7200}
  READINESS_PROBE_TIMEOUT_SECONDS: ${READINESS_PROBE_TIMEOUT_SECONDS:-2}
  READINESS_CACHE_TTL_SECONDS: ${READINESS_CACHE_TTL_SECONDS:-1}
  YUXI_CORS_ORIGINS: ${YUXI_CORS_ORIGINS:-}
  YUXI_DATASET_PERSIST_BATCH_SIZE: ${YUXI_DATASET_PERSIST_BATCH_SIZE:-1}
  YUXI_SKILL_DATA_DIR: /app/skill-sources
  YUXI_SKILL_PROJECTION_DIR: /app/skill-projections
  # 其他环境变量
  NO_PROXY: localhost,127.0.0.1,milvus,graph,minio,etcd,mineru-api,api.siliconflow.cn
  no_proxy: localhost,127.0.0.1,milvus,graph,minio,etcd,mineru-api,api.siliconflow.cn

# 长驻服务的容器日志轮转上界，防止 docker json.log 无限增长占满磁盘。
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-yuxi}-api:${YUXI_VERSION:-0.8.0.beta6}
    working_dir: /app
    user: "1000:1000"
    volumes:
      - ./backend/yuxi:/app/yuxi
      - type: bind
        source: ${YUXI_STATE_DIR:-./docker/volumes}/yuxi/threads
        target: /app/user-data
      - type: bind
        source: ${YUXI_STATE_DIR:-./docker/volumes}/yuxi/skill-sources
        target: /app/skill-sources
      - type: bind
        source: ${YUXI_STATE_DIR:-./docker/volumes}/yuxi/skill-projections
        target: /app/skill-projections
      - ./backend/test:/app/test
      - ./backend/scripts:/app/scripts
    ports:
      - "${YUXI_API_PORT:-5050}:5050"
    networks:
      - app-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ${YUXI_ENV_FILE:-.env}
    # region api_envs
    environment:
      <<: *api-worker-env
      YUXI_RUNTIME_DIR: /app/runtime/api
      YUXI_USER_DATA_DIR: /app/user-data
      POSTGRES_POOL_SIZE: ${API_POSTGRES_POOL_SIZE:-120}
      POSTGRES_MAX_OVERFLOW: ${API_POSTGRES_MAX_OVERFLOW:-40}
      POSTGRES_POOL_TIMEOUT_SECONDS: ${API_POSTGRES_POOL_TIMEOUT_SECONDS:-30}
      LANGGRAPH_POSTGRES_POOL_SIZE: ${API_LANGGRAPH_POSTGRES_POOL_SIZE:-10}
      LANGGRAPH_POSTGRES_POOL_TIMEOUT_SECONDS: ${API_LANGGRAPH_POSTGRES_POOL_TIMEOUT_SECONDS:-30}
      REDIS_MAX_CONNECTIONS: ${API_REDIS_MAX_CONNECTIONS:-256}
    # endregion api_envs
    command: uv run --no-sync --no-dev uvicorn yuxi.api.main:app --no-access-log --host 0.0.0.0 --port 5050 --timeout-graceful-shutdown 5
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5050/api/system/ready || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 8
      start_period: 180s
    depends_on:
      storage-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      app-init:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-yuxi}-api:${YUXI_VERSION:-0.8.0.beta6}
    working_dir: /app
    user: "1000:1000"
    volumes:
      - ./backend/yuxi:/app/yuxi
      - type: bind
        source: ${YUXI_STATE_DIR:-./docker/volumes}/yuxi/threads
        target: /app/user-data
      - type: bind
        source: ${YUXI_STATE_DIR:-./docker/volumes}/yuxi/skill-sources
        target: /app/skill-sources
      - type: bind
        source: ${YUXI_STATE_DIR:-./docker/volumes}/yuxi/skill-projections
        target: /app/skill-projections
      - ./backend/test:/app/test
      - ./backend/scripts:/app/scripts
      - ./backend/pyproject.toml:/app/pyproject.toml
      - ./backend/uv.lock:/app/uv.lock
    networks:
      - app-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ${YUXI_ENV_FILE:-.env}
    environment:
      <<: *api-worker-env
      YUXI_RUNTIME_DIR: /app/runtime/worker
      YUXI_USER_DATA_DIR: /app/user-data
      ARQ_MAX_JOBS: ${ARQ_MAX_JOBS:-140}
      REDIS_MAX_CONNECTIONS: ${WORKER_REDIS_MAX_CONNECTIONS:-256}
      POSTGRES_POOL_SIZE: ${WORKER_POSTGRES_POOL_SIZE:-120}
      POSTGRES_MAX_OVERFLOW: ${WORKER_POSTGRES_MAX_OVERFLOW:-40}
      POSTGRES_POOL_TIMEOUT_SECONDS: ${WORKER_POSTGRES_POOL_TIMEOUT_SECONDS:-30}
      LANGGRAPH_POSTGRES_POOL_SIZE: ${WORKER_LANGGRAPH_POSTGRES_POOL_SIZE:-120}
      LANGGRAPH_POSTGRES_POOL_TIMEOUT_SECONDS: ${WORKER_LANGGRAPH_POSTGRES_POOL_TIMEOUT_SECONDS:-30}
    command: uv run --no-sync --no-dev python -m yuxi.workers.main
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "yuxi.workers.health"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 180s
    depends_on:
      storage-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      app-init:
        condition: service_completed_successfully

  app-init:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-yuxi}-api:${YUXI_VERSION:-0.8.0.beta6}
    working_dir: /app
    volumes:
      - ${YUXI_STATE_DIR:-./docker/volumes}/yuxi/skill-sources:/app/skill-sources
      - ./backend/yuxi:/app/yuxi:ro
    networks:
      - app-network
    env_file:
      - ${YUXI_ENV_FILE:-.env}
    environment:
      <<: *api-worker-env
    command: uv run --no-sync --no-dev python -m yuxi.bootstrap.app
    restart: "no"
    depends_on:
      storage-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy


  # Container 沙盒后端：预构建/预拉取镜像后由 runner 按 Run 创建临时容器。
  # 只在 SANDBOX_BACKEND=container 时启用：docker compose --profile container up -d
  sandbox-image:
    build:
      context: .
      dockerfile: docker/sandbox.Dockerfile
    image: ${SANDBOX_CONTAINER_IMAGE:-yuxi-sandbox:${YUXI_VERSION:-0.8.0.beta6}}
    command: ["true"]
    network_mode: none
    profiles:
      - container
    restart: "no"

  sandbox-runner:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-yuxi}-api:${YUXI_VERSION:-0.8.0.beta6}
    working_dir: /app
    # Docker socket 等价于宿主 root；只允许这个专用进程持有。
    user: "0:0"
    volumes:
      - ./backend/yuxi:/app/yuxi
      - /var/run/docker.sock:/var/run/docker.sock
      - type: bind
        source: ${YUXI_STATE_DIR:-./docker/volumes}/yuxi/threads
        target: /sandbox-data
      - type: bind
        source: ${YUXI_STATE_DIR:-./docker/volumes}/yuxi/skill-projections
        target: /sandbox-skill-projections
        read_only: true
    networks:
      - app-network
    environment:
      POSTGRES_URL: ${POSTGRES_URL:-postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-yuxi}}
      YUXI_ENV: ${YUXI_ENV:-development}
      SANDBOX_RUNNER_TOKEN: ${SANDBOX_RUNNER_TOKEN:-}
      SANDBOX_CONTAINER_SOCKET: /var/run/docker.sock
      SANDBOX_CONTAINER_IMAGE: ${SANDBOX_CONTAINER_IMAGE:-yuxi-sandbox:${YUXI_VERSION:-0.8.0.beta6}}
      SANDBOX_CONTAINER_IMAGE_DIGEST: ${SANDBOX_CONTAINER_IMAGE_DIGEST:-}
      SANDBOX_CONTAINER_NETWORK: ${SANDBOX_CONTAINER_NETWORK:-none}
      SANDBOX_CONTAINER_MEMORY_BYTES: ${SANDBOX_CONTAINER_MEMORY_BYTES:-1073741824}
      SANDBOX_CONTAINER_CPUS: ${SANDBOX_CONTAINER_CPUS:-1}
      SANDBOX_CONTAINER_PIDS_LIMIT: ${SANDBOX_CONTAINER_PIDS_LIMIT:-256}
      SANDBOX_CONTAINER_HOME_BYTES: ${SANDBOX_CONTAINER_HOME_BYTES:-268435456}
      SANDBOX_CONTAINER_TMP_BYTES: ${SANDBOX_CONTAINER_TMP_BYTES:-268435456}
      SANDBOX_CONTAINER_MAX_CONTAINERS: ${SANDBOX_CONTAINER_MAX_CONTAINERS:-32}
      SANDBOX_CONTAINER_MAX_EXECS: ${SANDBOX_CONTAINER_MAX_EXECS:-8}
      SANDBOX_CONTAINER_MAX_LIFETIME_SECONDS: ${SANDBOX_CONTAINER_MAX_LIFETIME_SECONDS:-7200}
      SANDBOX_CONTAINER_UID: ${SANDBOX_CONTAINER_UID:-1000}
      SANDBOX_CONTAINER_GID: ${SANDBOX_CONTAINER_GID:-1000}
      NO_PROXY: localhost,127.0.0.1
      no_proxy: localhost,127.0.0.1
    command: uv run --no-sync --no-dev uvicorn yuxi.sandbox_runner.main:app --host 0.0.0.0 --port 8090 --no-access-log
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8090/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      sandbox-image:
        condition: service_completed_successfully
    profiles:
      - container

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      target: development
    image: ${COMPOSE_PROJECT_NAME:-yuxi}-frontend:${YUXI_VERSION:-0.8.0.beta6}
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/test:/app/test
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.js:/app/vite.config.js
    ports:
      - "${YUXI_FRONTEND_PORT:-5173}:5173"
    depends_on:
      - api
    networks:
      - app-network
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://api:5050
    command: pnpm run server
    restart: unless-stopped

  # region neo4j
  graph:
    image: neo4j:5.26.29
    ports:
      - "127.0.0.1:${YUXI_NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${YUXI_NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - type: bind
        source: ${YUXI_STATE_DIR:-./docker/volumes}/neo4j/data
        target: /data
      - type: bind
        source: ${YUXI_STATE_DIR:-./docker/volumes}/neo4j/logs
        target: /logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -a bolt://localhost:7687 -u ${NEO4J_USERNAME:-neo4j} -p ${NEO4J_PASSWORD:-0123456789} 'RETURN 1;' >/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    environment:
      - NEO4J_AUTH=${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-0123456789}
      - NEO4J_server_bolt_listen__address=0.0.0.0:7687
      - NEO4J_server_http_listen__address=0.0.0.0:7474
      - ENTITY_EMBEDDING=true
    networks:
      - app-network
    restart: unless-stopped
  # endregion neo4j

  etcd:
    image: quay.io/coreos/etcd:v3.5.25
    logging: *default-logging
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - type: bind
        source: ${YUXI_STATE_DIR:-./docker/volumes}/milvus/etcd
        target: /etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 30s
    networks:
      - app-network
    restart: unless-stopped

  minio:
    build:
      context: ./docker/minio
      dockerfile: Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-yuxi}-minio:RELEASE.2024-12-18T13-15-44Z
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - type: bind
        source: ${YUXI_STATE_DIR:-./docker/volumes}/milvus/minio
        target: /data
      - type: bind
        source: ${YUXI_STATE_DIR:-./docker/volumes}/milvus/minio_config
        target: /root/.minio
    command: minio server /data --address 0.0.0.0:9000 --console-address 0.0.0.0:9001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 30s
    ports:
      - "127.0.0.1:${YUXI_MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${YUXI_MINIO_CONSOLE_PORT:-9001}:9001"
    networks:
      - app-network
    restart: unless-stopped

  storage-init:
    build:
      context: .
      dockerfile: docker/storage-init.Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-yuxi}-storage-init:${YUXI_VERSION:-0.8.0.beta6}
    network_mode: none
    user: "0:0"
    volumes:
      - ${YUXI_STATE_DIR:-./docker/volumes}/yuxi/threads:/app/user-data
      - ${YUXI_STATE_DIR:-./docker/volumes}/yuxi/skill-sources:/app/skill-sources
      - ${YUXI_STATE_DIR:-./docker/volumes}/yuxi/skill-projections:/app/skill-projections
      - ${YUXI_STATE_DIR:-./docker/volumes}/milvus/milvus:/var/lib/milvus
      - ${YUXI_STATE_DIR:-./docker/volumes}/milvus/logs:/var/lib/milvus/logs
    restart: "no"

  milvus:
    image: milvusdb/milvus:v3.0.2
    command: ["milvus", "run", "standalone"]
    # 日志级别由 Milvus 配置拥有，
    # 这里只对 stdout/stderr 轮转封顶。内存随知识库数据量线性增长，不设 mem_limit：
    # 硬上界终会被合法增长击穿，击穿模式是 OOM→重启→重加载→再 OOM 的循环。
    # cpus 上限同时让内置 maxprocs 按 cgroup quota 收敛 GOMAXPROCS。
    logging: *default-logging
    cpus: ${YUXI_MILVUS_CPUS:-2}
    security_opt:
      - seccomp:unconfined
    environment:
      MQ_TYPE: woodpecker
      MINIO_REGION: us-east-1
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - type: bind
        source: ${YUXI_STATE_DIR:-./docker/volumes}/milvus/milvus
        target: /var/lib/milvus
      - type: bind
        source: ${YUXI_STATE_DIR:-./docker/volumes}/milvus/logs
        target: /var/lib/milvus/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 60s
      start_period: 120s
      timeout: 30s
      retries: 5
    ports:
      - "127.0.0.1:${YUXI_MILVUS_PORT:-19530}:19530"
      - "127.0.0.1:${YUXI_MILVUS_HEALTH_PORT:-9091}:9091"
    depends_on:
      storage-init:
        condition: service_completed_successfully
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  postgres:
    image: postgres:16
    command: ["postgres", "-c", "max_connections=${POSTGRES_MAX_CONNECTIONS:-600}"]
    # Docker 默认 /dev/shm 仅 64MiB，并行查询/hash 聚合会报
    # could not resize shared memory segment ... No space left on device
    shm_size: 1g
    ports:
      - "127.0.0.1:${YUXI_POSTGRES_PORT:-5432}:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-yuxi}
      - TZ=${TZ:-Asia/Shanghai}
    volumes:
      - type: bind
        source: ${YUXI_STATE_DIR:-./docker/volumes}/postgresql
        target: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-yuxi} || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - app-network
    restart: unless-stopped

  redis:
    image: redis:7.4.10-alpine
    ports:
      - "127.0.0.1:${YUXI_REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - type: bind
        source: ${YUXI_STATE_DIR:-./docker/volumes}/redis
        target: /data
    networks:
      - app-network
    restart: unless-stopped

  mineru-api:
    build:
      context: .
      dockerfile: docker/mineru.Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-yuxi}-mineru:4.1.3
    profiles:
      - all
    env_file:
      - ${YUXI_ENV_FILE:-.env}
    ports:
      - "127.0.0.1:${YUXI_MINERU_PORT:-30001}:30001"
    environment:
      MINERU_MODEL_SOURCE: local
      VLLM_USE_V1: "1"
    entrypoint: ["mineru-kit"]
    command:
      - api-server
      - --host
      - 0.0.0.0
      - --port
      - "30001"
      - --tier
      - advanced
    ulimits:
      memlock: -1
      stack: 67108864
    ipc: host
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:30001/v1/health || exit 1"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]  # Modify for multiple GPUs: ["0", "1"]
              capabilities: [gpu]
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge
