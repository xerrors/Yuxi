# 配置：uv run --project backend python scripts/init_abridge.py --yuxi-url ... --abridge-origin ...
# 启动时与 docker-compose.yml 或 docker-compose.prod.yml 一起使用。
x-identity-env: &identity-env
  YUXI_OIDC_PROVIDER_ENABLED: "true"
  YUXI_OIDC_PROVIDER_ISSUER: ${YUXI_OIDC_PROVIDER_ISSUER:?Run scripts/init_abridge.py first}
  YUXI_OIDC_PROVIDER_CLIENT_ID: ${YUXI_OIDC_PROVIDER_CLIENT_ID:-abridge}
  YUXI_OIDC_PROVIDER_CLIENT_SECRET: ${YUXI_OIDC_PROVIDER_CLIENT_SECRET:?Run scripts/init_abridge.py first}
  YUXI_OIDC_PROVIDER_REDIRECT_URI: ${YUXI_OIDC_PROVIDER_REDIRECT_URI:?Run scripts/init_abridge.py first}
  YUXI_OIDC_PROVIDER_PRIVATE_KEY_FILE: /run/yuxi-identity/provider.pem
  ABRIDGE_URL: ${ABRIDGE_URL:-http://abridge:8765}
  ABRIDGE_PUBLIC_ORIGIN: ${ABRIDGE_PUBLIC_ORIGIN:?Set browser-accessible aBridge origin}
  # 基础拓扑读取同一 env_file；显式清空，避免把远端管理凭据注入 API/worker。
  ABRIDGE_ADMIN_TOKEN: ""

services:
  api:
    group_add:
      - "${YUXI_OIDC_PROVIDER_KEY_GID:?Run scripts/init_abridge.py first}"
    environment:
      <<: *identity-env
    volumes:
      - ${YUXI_OIDC_PROVIDER_PRIVATE_KEY_FILE:?Run scripts/init_abridge.py first}:/run/yuxi-identity/provider.pem:ro
  worker:
    group_add:
      - "${YUXI_OIDC_PROVIDER_KEY_GID:?Run scripts/init_abridge.py first}"
    environment:
      <<: *identity-env
    volumes:
      - ${YUXI_OIDC_PROVIDER_PRIVATE_KEY_FILE:?Run scripts/init_abridge.py first}:/run/yuxi-identity/provider.pem:ro
  abridge:
    image: ghcr.io/xerrors/abridge:0.4.13@sha256:ac60d95888adfa8fa4ef4a78153f5e6f54ace8d287e7aa4c7bacc204873c2859
    restart: unless-stopped
    environment:
      ABRIDGE_DB: /data/server.db
      ABRIDGE_ADMIN_TOKEN: ${ABRIDGE_ADMIN_TOKEN:?Run scripts/init_abridge.py first}
      ABRIDGE_PUBLIC_ORIGIN: ${ABRIDGE_PUBLIC_ORIGIN:?Set browser-accessible aBridge origin}
      ABRIDGE_ALLOWED_HOSTS: abridge:8765
      ABRIDGE_OIDC_ISSUER_URL: ${YUXI_OIDC_PROVIDER_ISSUER:?Run scripts/init_abridge.py first}
      ABRIDGE_OIDC_CLIENT_ID: ${YUXI_OIDC_PROVIDER_CLIENT_ID:-abridge}
      ABRIDGE_OIDC_CLIENT_SECRET: ${YUXI_OIDC_PROVIDER_CLIENT_SECRET:?Run scripts/init_abridge.py first}
      # 浏览器仍使用公开 issuer；容器内发现、兑换与 JWKS 请求走私有 API 网络。
      ABRIDGE_OIDC_BACKCHANNEL_ORIGIN: http://api:5050
      ABRIDGE_DELEGATION_ENABLED: "true"
    ports:
      - "127.0.0.1:${YUXI_ABRIDGE_PORT:-18765}:8765"
    volumes:
      - abridge-data:/data
    networks:
      - app-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8765/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  abridge-data:
