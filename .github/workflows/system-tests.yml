        with:
          name: lifecycle-worker-e2e-junit
          path: backend/test/ci-reports/*.xml
          retention-days: 7
          if-no-files-found: warn
      - name: Runtime logs on failure
        if: failure() || cancelled()
        run: |
          docker compose logs api worker sandbox-runner milvus graph --tail 200
          docker ps -a --format 'table {{.Names}}\t{{.Status}}'
          docker stats --no-stream
          sudo ss -lntup
          free -h
          df -h / "$RUNNER_TEMP"
          sudo dmesg | tail -60
      - name: Stop runtime topology
        if: always()
        run: docker compose down -v

  # HTTP 契约、权限边界与 Knowledge 开关验证；其中附件 HTTP 与专属 Skill E2E 消费共享模型重放。
  # Knowledge 开关最先执行（它会重建 api 容器），重放随后启动；web 工具叠加拓扑最后执行（同样重建 api）。
  runtime-contracts:
    name: 运行时契约与知识开关
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Prepare writable test report directory
        run: mkdir -p backend/test/ci-reports && chmod 777 backend/test/ci-reports
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Prepare Compose environment
        run: bash scripts/ci/prepare_system_tests_env.sh
      - name: Restore api image layer cache
        id: api-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/yuxi-buildkit-cache/api
          key: buildkit-api-${{ runner.os }}-${{ hashFiles('backend/uv.lock', 'backend/pyproject.toml', 'docker/api.Dockerfile') }}
          restore-keys: |
            buildkit-api-${{ runner.os }}-
