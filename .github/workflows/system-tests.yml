        uses: actions/cache/restore@v4
        with:
          path: /tmp/yuxi-buildkit-cache/sandbox
          key: buildkit-sandbox-${{ runner.os }}-${{ hashFiles('docker/sandbox.Dockerfile') }}
          restore-keys: |
            buildkit-sandbox-${{ runner.os }}-
      - name: Build topology images with cached layers
        run: bash scripts/ci/build_topology_images.sh /tmp/yuxi-buildkit-cache/api /tmp/yuxi-buildkit-cache/minio /tmp/yuxi-buildkit-cache/sandbox
      - name: Save successful api build before runtime tests
        if: steps.api-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/yuxi-buildkit-cache/api
          key: ${{ steps.api-cache.outputs.cache-primary-key }}
      - name: Save successful minio build before runtime tests
        if: steps.minio-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/yuxi-buildkit-cache/minio
          key: ${{ steps.minio-cache.outputs.cache-primary-key }}
      - name: Save successful sandbox build before runtime tests
        if: steps.sandbox-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/yuxi-buildkit-cache/sandbox
          key: ${{ steps.sandbox-cache.outputs.cache-primary-key }}
      - name: Prepare isolated storage for runtime identity
        run: |
          docker compose run --rm --no-deps --user 0:0 api \
            install -d -o 1000 -g 1000 -m 0700 /app/user-data /app/skill-sources /app/skill-projections
      - name: Start runtime topology
        run: docker compose up -d postgres redis minio milvus graph sandbox-runner api worker
      - name: Wait for Milvus retrieval readiness
        run: |
          for attempt in $(seq 1 60); do
            if docker compose exec -T milvus curl -fsS http://localhost:9091/healthz >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs etcd minio milvus --tail 200
          exit 1
      - name: Wait for truthful readiness
        run: |
          for attempt in $(seq 1 90); do
            if curl -fsS http://localhost:5050/api/system/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs api worker --tail 200
          exit 1
      - name: Initialize isolated E2E administrator
        run: |
          curl -fsS -X POST http://localhost:5050/api/auth/initialize \
            -H 'Content-Type: application/json' \
            --data "{\"uid\":\"${E2E_USERNAME}\",\"password\":\"${E2E_PASSWORD}\"}" >/dev/null
      - name: Verify optional Knowledge deployment and chat recovery
        timeout-minutes: 8
        run: |
          docker compose -f docker-compose.yml -f docker-compose.no-knowledge.yml up -d --no-build app-init api worker milvus etcd graph
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:5050/api/system/ready >/dev/null; then
              break
            fi
            if [ "$attempt" = 60 ]; then exit 1; fi
            sleep 2
          done
          docker compose exec -T api uv run --no-sync --no-dev python - <<'PY'
          import httpx
          ready = httpx.get("http://localhost:5050/api/system/ready").json()
          assert ready["status"] == "ready" and ready["components"]["knowledge_base"]["status"] == "disabled", ready
          for path in ("/api/mcp", "/api/knowledge/knowledge-bases"):
              assert httpx.get("http://localhost:5050" + path).status_code == 404, path
          PY
          if docker compose ps --services --status running | rg '^(milvus|etcd|graph)$'; then exit 1; fi
          docker compose exec -T -e E2E_USERNAME -e E2E_PASSWORD api uv run --no-sync --no-dev pytest --junitxml=test/ci-reports/system-06.xml --durations=20 test/e2e/test_knowledge_mcp_agent.py::test_worker_preserves_selection_and_completes_after_knowledge_error -q
          docker compose -f docker-compose.yml up -d --no-build app-init api worker milvus etcd graph
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:5050/api/system/ready >/dev/null && docker compose exec -T milvus curl -fsS http://localhost:9091/healthz >/dev/null; then
              break
            fi
            if [ "$attempt" = 60 ]; then exit 1; fi
            sleep 2
          done
      - name: Start deterministic OpenAI-compatible replay
        run: |
          docker compose exec -d api uv run --no-sync --no-dev python test/support/openai_replay_server.py
          docker compose exec -d api uv run --no-sync --no-dev python -m test.support.cooperation_replay_server
          for attempt in $(seq 1 20); do
            if docker compose exec -T api curl -fsS http://localhost:8765/health >/dev/null && \
               docker compose exec -T api curl -fsS http://localhost:8766/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Verify worker shipping health
        run: docker compose exec -T worker uv run --no-sync --no-dev arq --check yuxi.workers.main.WorkerSettings
      - name: Verify worker can write personal Skill UserWorkspace
        run: |
          docker compose exec -T -e E2E_USERNAME worker uv run --no-sync --no-dev python - <<'PY'
          import os
          from pathlib import Path

          skill_root = Path("/app/user-data/shared") / os.environ["E2E_USERNAME"] / "workspace/agents/skills"
          skill_root.mkdir(parents=True, exist_ok=True)
          probe = skill_root / ".worker-write-probe"
          try:
              probe.write_text("worker-write-ok", encoding="utf-8")
              assert probe.read_text(encoding="utf-8") == "worker-write-ok"
          finally:
              probe.unlink(missing_ok=True)
          PY
      - name: Verify worker health leases are expiring runtime facts
        run: |
          worker_ttl=$(docker compose exec -T redis redis-cli PTTL yuxi:worker:health:agent-run-v1)
          reconciliation_ttl=$(docker compose exec -T redis redis-cli PTTL yuxi:worker:health:agent-run-v1:lease-reconciliation)
          test "$worker_ttl" -gt 0 && test "$worker_ttl" -le 6000
          test "$reconciliation_ttl" -gt 0 && test "$reconciliation_ttl" -le 65000
      - name: Verify dead worker removes API readiness
        run: |
          docker compose pause worker
          cleanup() { docker compose unpause worker >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          not_ready=false
          for attempt in $(seq 1 15); do
            status=$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:5050/api/system/ready)
            if [ "$status" = "503" ]; then
              not_ready=true
              break
            fi
            sleep 1
          done
          test "$not_ready" = true
          cleanup
          trap - EXIT
          for attempt in $(seq 1 15); do
            if curl -fsS http://localhost:5050/api/system/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Verify readiness API
        run: docker compose exec -T api uv run --no-sync --no-dev pytest --junitxml=test/ci-reports/system-07.xml --durations=20 test/integration/api/test_system_router_api.py::test_health_endpoint_is_public test/integration/api/test_system_router_api.py::test_readiness_endpoint_proves_core_runtime_dependencies test/integration/api/test_system_router_api.py::test_discovery_and_openapi_declare_full_knowledge_capabilities -q
      - name: Verify attachment HTTP and object contract
        timeout-minutes: 3
        run: docker compose exec -T -e TEST_USERNAME="$E2E_USERNAME" -e TEST_PASSWORD="$E2E_PASSWORD" api uv run --no-sync --no-dev pytest --junitxml=test/ci-reports/system-08.xml --durations=20 test/integration/api/test_chat_router.py::test_thread_artifact_uses_image_signature_for_content_type test/integration/api/test_public_agent_files.py -q
      - name: Verify MCP management connection contract
        run: docker compose exec -T -e TEST_USERNAME="$E2E_USERNAME" -e TEST_PASSWORD="$E2E_PASSWORD" api uv run --no-sync --no-dev pytest --junitxml=test/ci-reports/system-10.xml --durations=20 test/integration/api/test_mcp_router.py -q
      - name: Verify knowledge MCP authentication and persisted documents
        run: docker compose exec -T -e TEST_USERNAME="$E2E_USERNAME" -e TEST_PASSWORD="$E2E_PASSWORD" api uv run --no-sync --no-dev pytest --junitxml=test/ci-reports/system-11.xml --durations=20 test/integration/api/test_knowledge_mcp.py test/integration/api/test_knowledge_mcp_delegation.py -q
      - name: Verify module failure and permission boundaries
        run: docker compose exec -T -e TEST_USERNAME="$E2E_USERNAME" -e TEST_PASSWORD="$E2E_PASSWORD" api uv run --no-sync --no-dev pytest --junitxml=test/ci-reports/system-12.xml --durations=20 test/integration/api/test_module_failure_boundaries.py -q
      - name: Verify roles, grants and private Agent HTTP boundaries
        run: docker compose exec -T -e TEST_USERNAME="$E2E_USERNAME" -e TEST_PASSWORD="$E2E_PASSWORD" api uv run --no-sync --no-dev pytest --junitxml=test/ci-reports/system-13.xml --durations=20 test/integration/api/test_permission_convergence.py test/integration/identity/test_identity_permission_constraints.py -q
      - name: Verify private owner fields and shared manager resource patches
        run: docker compose exec -T -e TEST_USERNAME="$E2E_USERNAME" -e TEST_PASSWORD="$E2E_PASSWORD" api uv run --no-sync --no-dev pytest --junitxml=test/ci-reports/system-14.xml --durations=20 test/integration/api/test_agent_config_resource_authorization.py -q
      - name: Verify Skill content commits and Agent exclusive history HTTP boundaries
        run: docker compose exec -T -e TEST_USERNAME="$E2E_USERNAME" -e TEST_PASSWORD="$E2E_PASSWORD" api uv run --no-sync --no-dev pytest --junitxml=test/ci-reports/system-16.xml --durations=20 test/integration/api/test_agent_bound_skill.py test/integration/api/test_shared_skill_edit_router.py -q
      - name: Verify exclusive Skill preload and restore through worker
        run: docker compose exec -T -e E2E_USERNAME -e E2E_PASSWORD api uv run --no-sync --no-dev pytest --junitxml=test/ci-reports/system-17.xml --durations=20 test/e2e/test_agent_bound_skill_e2e.py -q
      - name: Verify atomic Agent creation with Skill and MCP
        run: docker compose exec -T -e TEST_USERNAME="$E2E_USERNAME" -e TEST_PASSWORD="$E2E_PASSWORD" api uv run --no-sync --no-dev pytest --junitxml=test/ci-reports/system-18.xml --durations=20 test/integration/api/test_agent_create_resources.py -q
      - name: Verify Input attachment persistence and object storage
        run: >-
          docker compose exec -T -e TEST_BASE_URL=http://127.0.0.1:1 -e CUBE_API_URL=http://127.0.0.1:1
          -e TEST_USERNAME=fixture-probe -e TEST_PASSWORD=fixture-probe api uv run --no-sync --no-dev pytest
          --junitxml=test/ci-reports/system-21.xml --durations=20
          test/integration/services/test_input_attachments.py
          test/integration/services/test_knowledge_object_lifecycle.py -q
      - name: Verify Turn result causality
        run: docker compose exec -T -e TEST_USERNAME="$E2E_USERNAME" -e TEST_PASSWORD="$E2E_PASSWORD" api uv run --no-sync --no-dev pytest --junitxml=test/ci-reports/system-22.xml --durations=20 test/integration/api/test_turn_result_causality.py -q
      - name: Verify feedback HTTP access
        timeout-minutes: 5
        run: |
          docker compose exec -T -e TEST_USERNAME="$E2E_USERNAME" -e TEST_PASSWORD="$E2E_PASSWORD" api uv run --no-sync --no-dev pytest --junitxml=test/ci-reports/system-23.xml --durations=20 test/integration/api/test_agent_feedback_api.py -q
      - name: Verify lifecycle HTTP and PostgreSQL boundaries
        timeout-minutes: 8
        run: |
          docker compose exec -T -e TEST_USERNAME="$E2E_USERNAME" -e TEST_PASSWORD="$E2E_PASSWORD" api \
            uv run --no-sync --no-dev pytest --junitxml=test/ci-reports/system-24.xml --durations=20 \
            test/integration/api/test_chat_router.py::test_public_thread_endpoints_require_authentication \
            test/integration/api/test_chat_router.py::test_public_create_rejects_empty_input \
            test/integration/api/test_chat_router.py::test_public_missing_thread_and_turn_return_not_found \
            test/integration/api/test_chat_router.py::test_public_input_rejects_unbound_attachment_without_persisting_receipt \
            test/integration/api/test_removed_api_endpoints.py::test_removed_agent_session_entrypoints_are_unreachable \
            test/integration/api/test_public_agents_key_boundary.py \
            test/integration/services/test_agent_input_schema.py \
            test/integration/services/test_project_thread_archive.py \
            test/integration/services/test_run_stream_redis.py -q
      - name: Verify Knowledge Key HTTP boundary without optional knowledge runtime
        run: |
          docker compose exec -T -e TEST_USERNAME="$E2E_USERNAME" -e TEST_PASSWORD="$E2E_PASSWORD" api \
            uv run --no-sync --no-dev pytest --junitxml=test/ci-reports/system-25.xml --durations=20 \
            test/integration/api/test_public_knowledge_tools.py::test_knowledge_key_tool_route_boundary_without_kb \
            test/integration/api/test_public_knowledge_tools.py::test_agents_key_cannot_access_public_knowledge_api \
            test/integration/api/test_removed_api_endpoints.py::test_public_knowledge_does_not_expose_management_routes -q
      - name: Verify Session tree recovery and visibility
        run: docker compose exec -T -e TEST_USERNAME="$E2E_USERNAME" -e TEST_PASSWORD="$E2E_PASSWORD" api uv run --no-sync --no-dev pytest --junitxml=test/ci-reports/system-26.xml --durations=20 test/integration/api/test_session_cooperation_state_recovery.py -q
      - name: Verify Message audit HTTP contract
        timeout-minutes: 3
        run: docker compose exec -T -e TEST_USERNAME="$E2E_USERNAME" -e TEST_PASSWORD="$E2E_PASSWORD" api uv run --no-sync --no-dev pytest --junitxml=test/ci-reports/system-27.xml --durations=20 test/integration/api/test_chat_router.py::test_thread_message_audits_return_persisted_facts_without_leaking_into_history test/integration/api/test_chat_router.py::test_debug_messages_follow_database_sequence_and_include_unassigned_inputs -q --setup-show -o faulthandler_timeout=60
      - name: Verify identity transaction and replayable secret publication
        run: docker compose exec -T -e TEST_USERNAME="$E2E_USERNAME" -e TEST_PASSWORD="$E2E_PASSWORD" api uv run --no-sync --no-dev pytest --junitxml=test/ci-reports/system-28.xml --durations=20 test/integration/services/test_identity_admin_service.py test/integration/services/test_api_key_user_lifecycle.py test/integration/api/test_apikey_router.py -q
      - name: Verify department HTTP counts and lifecycle
        run: docker compose exec -T -e TEST_USERNAME="$E2E_USERNAME" -e TEST_PASSWORD="$E2E_PASSWORD" api uv run --no-sync --no-dev pytest --junitxml=test/ci-reports/system-29.xml --durations=20 test/integration/api/test_department_router.py -q
      - name: Verify OIDC and MCP OAuth proxy log and cache boundaries
        run: python3 scripts/ci/verify_oidc_proxy.py
      - name: Verify Workdir and Skill authorization
        run: |
          docker compose exec -T -e TEST_USERNAME="$E2E_USERNAME" -e TEST_PASSWORD="$E2E_PASSWORD" api uv run --no-sync --no-dev pytest --junitxml=test/ci-reports/system-30.xml --durations=20 \
            test/integration/services/test_project_workdir.py::test_sessions_share_workdir_only_through_project \
            test/integration/services/test_user_skill_projection.py \
            test/integration/api/test_skill_artifact_authorization.py -q
      - name: Verify web tool configuration and official HTTPS protocols
        run: |
          docker compose exec -T api uv run --no-sync --no-dev pytest --junitxml=test/ci-reports/system-33.xml --durations=20 \
            test/integration/api/test_web_tools_settings.py \
            test/integration/services/test_web_provider_protocol.py -q
      - name: Verify OCR configuration and complete parsing artifacts
        timeout-minutes: 8
        run: |
          docker compose exec -T -e E2E_USERNAME -e E2E_PASSWORD api \
            uv run --no-sync --no-dev pytest --junitxml=test/ci-reports/system-ocr.xml --durations=20 \
            test/e2e/test_ocr_config_center_e2e.py test/e2e/test_document_parsing_artifacts_e2e.py -q
      - name: Verify Search and Fetch configuration through worker
        run: |
          docker compose -f docker-compose.yml -f backend/test/e2e/web-tools.compose.yml up -d web-provider-replay api worker
          for attempt in $(seq 1 60); do
            if docker compose exec -T api curl -fsS http://localhost:5050/api/system/ready >/dev/null; then
              break
            fi
            sleep 2
          done
          docker compose exec -T -e E2E_USERNAME -e E2E_PASSWORD api uv run --no-sync --no-dev pytest --junitxml=test/ci-reports/system-34.xml --durations=20 test/e2e/test_web_tools_e2e.py -q
      - name: Make container test reports readable
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" backend/test/ci-reports
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-contracts-junit
          path: backend/test/ci-reports/*.xml
          retention-days: 7
          if-no-files-found: warn
      - name: Runtime logs on failure
        if: failure() || cancelled()
        run: |
          docker compose logs api worker sandbox-runner milvus graph --tail 200
          docker ps -a --format 'table {{.Names}}\t{{.Status}}'
          docker stats --no-stream
          sudo ss -lntup
          free -h
          df -h / "$RUNNER_TEMP"
          sudo dmesg | tail -60
      - name: Stop runtime topology
        if: always()
        run: docker compose -f docker-compose.yml -f backend/test/e2e/web-tools.compose.yml down -v --remove-orphans

  # 沙盒容器隔离在宿主机直接执行 container 语义，不需要 Compose 拓扑；
  # 只复用拓扑镜像构建产物中的 sandbox 镜像。
  sandbox-isolation:
    name: 沙盒容器隔离
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.6'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Prepare writable test report directory
        run: mkdir -p backend/test/ci-reports
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Prepare Compose environment
        run: bash scripts/ci/prepare_system_tests_env.sh
      - name: Restore sandbox image layer cache
        id: sandbox-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/yuxi-buildkit-cache/sandbox
          key: buildkit-sandbox-${{ runner.os }}-${{ hashFiles('docker/sandbox.Dockerfile') }}
          restore-keys: |
            buildkit-sandbox-${{ runner.os }}-
      - name: Build sandbox image with cached layers
        run: bash scripts/ci/build_topology_images.sh "" "" /tmp/yuxi-buildkit-cache/sandbox --sandbox-only
      - name: Save successful sandbox build before runtime tests
        if: steps.sandbox-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/yuxi-buildkit-cache/sandbox
          key: ${{ steps.sandbox-cache.outputs.cache-primary-key }}
      - name: Verify real container storage and process isolation
        timeout-minutes: 12
        run: SANDBOX_CONTAINER_TEST=1 SANDBOX_CONTAINER_IMAGE="$(docker compose config --format json | jq -r '.services["sandbox-image"].image')" uv run --project backend --locked --group test pytest --junitxml=backend/test/ci-reports/system-32.xml --durations=20 backend/test/integration/sandbox/test_container_sandbox.py -q
      - name: Make container test reports readable
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" backend/test/ci-reports
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sandbox-isolation-junit
          path: backend/test/ci-reports/*.xml
          retention-days: 7
          if-no-files-found: warn
      - name: Runtime logs on failure
        if: failure() || cancelled()
        run: |
          docker ps -a --format 'table {{.Names}}\t{{.Status}}'
          df -h / "$RUNNER_TEMP"
          sudo dmesg | tail -60

  result:
    if: always()
    needs: [background-job-worker-path, cooperation-e2e, lifecycle-worker-e2e, runtime-contracts, sandbox-isolation]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check all job results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci/gate.py check-jobs
