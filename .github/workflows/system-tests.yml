name: Runtime System Tests

on:
  workflow_call:
  push:
    tags: ['v[0-9]*']
    branches: [main, 'develop/**']
    paths:
      - '.env.template'
      - 'backend/yuxi/**'
      - 'backend/pyproject.toml'
      - 'backend/uv.lock'
      - 'backend/test/integration/**'
      - 'backend/test/e2e/**'
      - 'backend/test/support/**'
      - 'backend/test/run_tests.sh'
      - 'docker/**'
      - 'docker-compose.yml'
      - 'docker-compose.prod.yml'
      - 'docker-compose.no-knowledge.yml'
      - 'scripts/ci/prepare_system_tests_env.sh'
      - 'scripts/ci/build_topology_images.sh'
      - '.github/workflows/system-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: system-tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  JWT_SECRET_KEY: ci-jwt-secret-at-least-thirty-two-characters
  API_KEY_DERIVATION_SECRET: ci-api-key-derivation-secret-at-least-32-chars
  CONTAINER_E2E_REPLAY_URL_TEMPLATE: http://api:{port}/v1
  OPENAI_REPLAY_URL: http://api:8765/v1
  COOPERATION_REPLAY_URL: http://api:8766/v1
  E2E_USERNAME: ci_e2e_admin
  E2E_PASSWORD: ci-e2e-password-at-least-eight

jobs:
  # 后台作业验证会重建 api/worker 和 Milvus；其独立拓扑也执行检索测试。
  # 各 job 各自持有完整拓扑，并共享镜像层缓存。
  background-job-worker-path:
    name: 后台作业与检索
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Prepare writable test report directory
        run: mkdir -p backend/test/ci-reports && chmod 777 backend/test/ci-reports
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Prepare Compose environment
        run: bash scripts/ci/prepare_system_tests_env.sh
      - name: Restore api image layer cache
        id: api-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/yuxi-buildkit-cache/api
          key: buildkit-api-${{ runner.os }}-${{ hashFiles('backend/uv.lock', 'backend/pyproject.toml', 'docker/api.Dockerfile') }}
          restore-keys: |
            buildkit-api-${{ runner.os }}-
      - name: Restore minio image layer cache
        id: minio-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/yuxi-buildkit-cache/minio
          key: buildkit-minio-${{ runner.os }}-${{ hashFiles('docker/minio/Dockerfile', 'docker/minio/docker-entrypoint.sh') }}
          restore-keys: |
            buildkit-minio-${{ runner.os }}-
      - name: Restore sandbox image layer cache
        id: sandbox-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/yuxi-buildkit-cache/sandbox
          key: buildkit-sandbox-${{ runner.os }}-${{ hashFiles('docker/sandbox.Dockerfile') }}
          restore-keys: |
            buildkit-sandbox-${{ runner.os }}-
      - name: Build topology images with cached layers
        run: bash scripts/ci/build_topology_images.sh /tmp/yuxi-buildkit-cache/api /tmp/yuxi-buildkit-cache/minio /tmp/yuxi-buildkit-cache/sandbox
      - name: Save successful api build before runtime tests
        if: steps.api-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/yuxi-buildkit-cache/api
          key: ${{ steps.api-cache.outputs.cache-primary-key }}
      - name: Save successful minio build before runtime tests
        if: steps.minio-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/yuxi-buildkit-cache/minio
          key: ${{ steps.minio-cache.outputs.cache-primary-key }}
      - name: Save successful sandbox build before runtime tests
        if: steps.sandbox-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/yuxi-buildkit-cache/sandbox
          key: ${{ steps.sandbox-cache.outputs.cache-primary-key }}
      - name: Prepare isolated storage for runtime identity
        run: |
          docker compose run --rm --no-deps --user 0:0 api \
            install -d -o 1000 -g 1000 -m 0700 /app/user-data /app/skill-sources /app/skill-projections
      - name: Start background-job runtime topology
        run: docker compose up -d postgres redis minio etcd milvus graph sandbox-runner api worker
      - name: Wait for background-job topology readiness
        run: |
          for attempt in $(seq 1 60); do
            if docker compose exec -T milvus curl -fsS http://localhost:9091/healthz >/dev/null; then
              break
            fi
            if [ "$attempt" = 60 ]; then
              docker compose logs etcd minio milvus --tail 200
              exit 1
            fi
            sleep 2
          done
          for attempt in $(seq 1 90); do
            if curl -fsS http://localhost:5050/api/system/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs api worker --tail 200
          exit 1
      - name: Initialize isolated E2E administrator
        run: |
          curl -fsS -X POST http://localhost:5050/api/auth/initialize \
            -H 'Content-Type: application/json' \
            --data "{\"uid\":\"${E2E_USERNAME}\",\"password\":\"${E2E_PASSWORD}\"}" >/dev/null
      - name: Verify 后台作业 worker path
        run: |
          docker compose stop api worker
          docker compose run --rm app-init
          docker compose run --rm --no-deps \
            -e BACKGROUND_JOB_GATE_ID=${{ github.run_id }} api \
            uv run --no-sync --no-dev pytest --junitxml=test/ci-reports/system-01.xml --durations=20 \
              test/integration/services/test_background_job_worker_path.py::test_prepare_job_with_failed_initial_arq_publication -q
          docker compose up -d --force-recreate milvus api worker
          for attempt in $(seq 1 60); do
            if docker compose exec -T milvus curl -fsS http://localhost:9091/healthz >/dev/null; then
              break
            fi
            if [ "$attempt" = 60 ]; then
              docker compose logs etcd minio milvus --tail 200
              exit 1
            fi
            sleep 2
          done
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:5050/api/system/ready >/dev/null; then
              break
            fi
            if [ "$attempt" = 60 ]; then
              docker compose logs api worker --tail 200
              exit 1
            fi
            sleep 2
          done
          docker compose exec -T -e BACKGROUND_JOB_GATE_ID=${{ github.run_id }} api \
            uv run --no-sync --no-dev pytest --junitxml=test/ci-reports/system-02.xml --durations=20 \
              test/integration/services/test_background_job_worker_path.py::test_shipping_worker_startup_recovers_pending_publication -q
          docker compose exec -T -e BACKGROUND_JOB_GATE_ID=${{ github.run_id }} api \
            uv run --no-sync --no-dev pytest --junitxml=test/ci-reports/system-03.xml --durations=20 \
              test/integration/services/test_background_job_worker_path.py::test_shipping_worker_failure_runs_domain_hook -q
          docker compose exec -T \
            -e TEST_USERNAME=${E2E_USERNAME} \
            -e TEST_PASSWORD=${E2E_PASSWORD} api \
            uv run --no-sync --no-dev pytest --junitxml=test/ci-reports/system-04.xml --durations=20 \
              test/integration/api/test_background_jobs_router.py::test_enqueue_document_creates_job \
              test/integration/api/test_knowledge_upload_staging.py \
              test/integration/api/test_knowledge_directory_imports.py \
              test/integration/api/test_knowledge_file_summary.py \
              test/integration/api/test_graph_build_status.py -q
      - name: Verify document rollback projections and recovery
        run: |
          docker compose exec -T api uv run --no-sync --no-dev pytest --junitxml=test/ci-reports/system-05.xml --durations=20 \
            test/integration/graphs/test_file_graph_clear.py \
            test/integration/services/test_knowledge_document_resets.py -q
      - name: Verify Milvus 3 text retrieval through worker
        run: docker compose exec -T -e E2E_USERNAME -e E2E_PASSWORD api uv run --no-sync --no-dev pytest --junitxml=test/ci-reports/system-19.xml --durations=20 test/e2e/test_milvus_text_retrieval_e2e.py -q
      - name: Make container test reports readable
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" backend/test/ci-reports
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: background-job-worker-path-junit
          path: backend/test/ci-reports/*.xml
          retention-days: 7
          if-no-files-found: warn
      - name: Runtime logs on failure
        if: failure() || cancelled()
        run: |
          docker compose logs api worker sandbox-runner milvus graph --tail 200
          docker ps -a --format 'table {{.Names}}\t{{.Status}}'
          docker stats --no-stream
          sudo ss -lntup
          free -h
          df -h / "$RUNNER_TEMP"
          sudo dmesg | tail -60
      - name: Stop runtime topology
        if: always()
        run: docker compose down -v

  # 会话协作 E2E 是生命周期批次中最重的文件（约 445 秒，多为时序等待断言），
  # 单独成 job 与其余模型驱动 E2E 并行；每个拓扑 job 各自构建镜像并初始化独立管理员。
  cooperation-e2e:
    name: 会话协作 E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Prepare writable test report directory
        run: mkdir -p backend/test/ci-reports && chmod 777 backend/test/ci-reports
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Prepare Compose environment
        run: bash scripts/ci/prepare_system_tests_env.sh
      - name: Restore api image layer cache
        id: api-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/yuxi-buildkit-cache/api
          key: buildkit-api-${{ runner.os }}-${{ hashFiles('backend/uv.lock', 'backend/pyproject.toml', 'docker/api.Dockerfile') }}
          restore-keys: |
            buildkit-api-${{ runner.os }}-
      - name: Restore minio image layer cache
        id: minio-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/yuxi-buildkit-cache/minio
          key: buildkit-minio-${{ runner.os }}-${{ hashFiles('docker/minio/Dockerfile', 'docker/minio/docker-entrypoint.sh') }}
          restore-keys: |
            buildkit-minio-${{ runner.os }}-
      - name: Restore sandbox image layer cache
        id: sandbox-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/yuxi-buildkit-cache/sandbox
          key: buildkit-sandbox-${{ runner.os }}-${{ hashFiles('docker/sandbox.Dockerfile') }}
          restore-keys: |
            buildkit-sandbox-${{ runner.os }}-
      - name: Build topology images with cached layers
        run: bash scripts/ci/build_topology_images.sh /tmp/yuxi-buildkit-cache/api /tmp/yuxi-buildkit-cache/minio /tmp/yuxi-buildkit-cache/sandbox
      - name: Save successful api build before runtime tests
        if: steps.api-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/yuxi-buildkit-cache/api
          key: ${{ steps.api-cache.outputs.cache-primary-key }}
      - name: Save successful minio build before runtime tests
        if: steps.minio-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/yuxi-buildkit-cache/minio
          key: ${{ steps.minio-cache.outputs.cache-primary-key }}
      - name: Save successful sandbox build before runtime tests
        if: steps.sandbox-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/yuxi-buildkit-cache/sandbox
          key: ${{ steps.sandbox-cache.outputs.cache-primary-key }}
      - name: Prepare isolated storage for runtime identity
        run: |
          docker compose run --rm --no-deps --user 0:0 api \
            install -d -o 1000 -g 1000 -m 0700 /app/user-data /app/skill-sources /app/skill-projections
      - name: Start runtime topology
        run: docker compose up -d postgres redis minio milvus graph sandbox-runner api worker
      - name: Wait for Milvus retrieval readiness
        run: |
          for attempt in $(seq 1 60); do
            if docker compose exec -T milvus curl -fsS http://localhost:9091/healthz >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs etcd minio milvus --tail 200
          exit 1
      - name: Wait for truthful readiness
        run: |
          for attempt in $(seq 1 90); do
            if curl -fsS http://localhost:5050/api/system/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs api worker --tail 200
          exit 1
      - name: Initialize isolated E2E administrator
        run: |
          curl -fsS -X POST http://localhost:5050/api/auth/initialize \
            -H 'Content-Type: application/json' \
            --data "{\"uid\":\"${E2E_USERNAME}\",\"password\":\"${E2E_PASSWORD}\"}" >/dev/null
      - name: Start deterministic OpenAI-compatible replay
        run: |
          docker compose exec -d api uv run --no-sync --no-dev python test/support/openai_replay_server.py
          docker compose exec -d api uv run --no-sync --no-dev python -m test.support.cooperation_replay_server
          for attempt in $(seq 1 20); do
            if docker compose exec -T api curl -fsS http://localhost:8765/health >/dev/null && \
               docker compose exec -T api curl -fsS http://localhost:8766/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Verify 会话协作 E2E
        timeout-minutes: 15
        run: CI_TEST_REPORT_DIR=test/ci-reports TEST_USERNAME="$E2E_USERNAME" TEST_PASSWORD="$E2E_PASSWORD" bash backend/test/run_tests.sh e2e-cooperation
      - name: Make container test reports readable
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" backend/test/ci-reports
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cooperation-e2e-junit
          path: backend/test/ci-reports/*.xml
          retention-days: 7
          if-no-files-found: warn
      - name: Runtime logs on failure
        if: failure() || cancelled()
        run: |
          docker compose logs api worker sandbox-runner milvus graph --tail 200
          docker ps -a --format 'table {{.Names}}\t{{.Status}}'
          docker stats --no-stream
          sudo ss -lntup
          free -h
          df -h / "$RUNNER_TEMP"
          sudo dmesg | tail -60
      - name: Stop runtime topology
        if: always()
        run: docker compose down -v

  # 生命周期批次其余文件与经 worker 执行的模型驱动 E2E 共用一拓扑；
  # 全部步骤依赖共享模型重放，重放启动后不再重建 api 容器。
  lifecycle-worker-e2e:
    name: 生命周期与 worker E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Prepare writable test report directory
        run: mkdir -p backend/test/ci-reports && chmod 777 backend/test/ci-reports
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Prepare Compose environment
        run: bash scripts/ci/prepare_system_tests_env.sh
      - name: Restore api image layer cache
        id: api-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/yuxi-buildkit-cache/api
          key: buildkit-api-${{ runner.os }}-${{ hashFiles('backend/uv.lock', 'backend/pyproject.toml', 'docker/api.Dockerfile') }}
          restore-keys: |
            buildkit-api-${{ runner.os }}-
      - name: Restore minio image layer cache
        id: minio-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/yuxi-buildkit-cache/minio
          key: buildkit-minio-${{ runner.os }}-${{ hashFiles('docker/minio/Dockerfile', 'docker/minio/docker-entrypoint.sh') }}
          restore-keys: |
            buildkit-minio-${{ runner.os }}-
      - name: Restore sandbox image layer cache
        id: sandbox-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/yuxi-buildkit-cache/sandbox
          key: buildkit-sandbox-${{ runner.os }}-${{ hashFiles('docker/sandbox.Dockerfile') }}
          restore-keys: |
            buildkit-sandbox-${{ runner.os }}-
      - name: Build topology images with cached layers
        run: bash scripts/ci/build_topology_images.sh /tmp/yuxi-buildkit-cache/api /tmp/yuxi-buildkit-cache/minio /tmp/yuxi-buildkit-cache/sandbox
      - name: Save successful api build before runtime tests
        if: steps.api-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/yuxi-buildkit-cache/api
          key: ${{ steps.api-cache.outputs.cache-primary-key }}
      - name: Save successful minio build before runtime tests
        if: steps.minio-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/yuxi-buildkit-cache/minio
          key: ${{ steps.minio-cache.outputs.cache-primary-key }}
      - name: Save successful sandbox build before runtime tests
        if: steps.sandbox-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/yuxi-buildkit-cache/sandbox
          key: ${{ steps.sandbox-cache.outputs.cache-primary-key }}
      - name: Prepare isolated storage for runtime identity
        run: |
          docker compose run --rm --no-deps --user 0:0 api \
            install -d -o 1000 -g 1000 -m 0700 /app/user-data /app/skill-sources /app/skill-projections
      - name: Start runtime topology
        run: docker compose up -d postgres redis minio milvus graph sandbox-runner api worker
      - name: Wait for Milvus retrieval readiness
        run: |
          for attempt in $(seq 1 60); do
            if docker compose exec -T milvus curl -fsS http://localhost:9091/healthz >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs etcd minio milvus --tail 200
          exit 1
      - name: Wait for truthful readiness
        run: |
          for attempt in $(seq 1 90); do
            if curl -fsS http://localhost:5050/api/system/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs api worker --tail 200
          exit 1
      - name: Initialize isolated E2E administrator
        run: |
          curl -fsS -X POST http://localhost:5050/api/auth/initialize \
            -H 'Content-Type: application/json' \
            --data "{\"uid\":\"${E2E_USERNAME}\",\"password\":\"${E2E_PASSWORD}\"}" >/dev/null
      - name: Start deterministic OpenAI-compatible replay
        run: |
          docker compose exec -d api uv run --no-sync --no-dev python test/support/openai_replay_server.py
          docker compose exec -d api uv run --no-sync --no-dev python -m test.support.cooperation_replay_server
          for attempt in $(seq 1 20); do
            if docker compose exec -T api curl -fsS http://localhost:8765/health >/dev/null && \
               docker compose exec -T api curl -fsS http://localhost:8766/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Verify deterministic Agent lifecycle
        timeout-minutes: 10
        run: CI_TEST_REPORT_DIR=test/ci-reports TEST_USERNAME="$E2E_USERNAME" TEST_PASSWORD="$E2E_PASSWORD" bash backend/test/run_tests.sh e2e-core
      - name: Verify MCP failure isolation through worker
        run: docker compose exec -T -e E2E_USERNAME -e E2E_PASSWORD api uv run --no-sync --no-dev pytest --junitxml=test/ci-reports/system-09.xml --durations=20 test/e2e/test_mcp_failure_isolation.py -q
      - name: Verify permission revocation through worker
        run: docker compose exec -T -e E2E_USERNAME -e E2E_PASSWORD api uv run --no-sync --no-dev pytest --junitxml=test/ci-reports/system-15.xml --durations=20 test/e2e/test_permission_revocation_e2e.py -q
      - name: Verify Agent knowledge MCP tools and sources
        run: docker compose exec -T -e E2E_USERNAME -e E2E_PASSWORD api uv run --no-sync --no-dev pytest --junitxml=test/ci-reports/system-20.xml --durations=20 test/e2e/test_knowledge_mcp_agent.py -q
      - name: Verify container Agent execution and steer cleanup through HTTP and worker
        run: docker compose exec -T -e E2E_USERNAME -e E2E_PASSWORD -e CONTAINER_E2E_REPLAY_URL_TEMPLATE api uv run --no-sync --no-dev pytest --junitxml=test/ci-reports/system-31.xml --durations=20 test/e2e/test_container_agent_execution_e2e.py -q
