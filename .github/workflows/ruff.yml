# GitHub Actions workflow for Ruff code formatting and linting
# 自动运行 Ruff 格式检查
#
# 触发场景：
# 1. Pull Request：发现问题直接标红，要求开发者本地运行 make format
# 2. Push 到 main/develop/**：仅检查并在发现问题时标红，不修改仓库内容

name: Ruff Format Check

on:
  workflow_call:
  workflow_dispatch:
  push:
    tags: ['v[0-9]*']
    branches:
      - main
      - 'develop/**'
    paths:
      - 'backend/**/*.py'
      - 'backend/pyproject.toml'
      - 'backend/uv.lock'
      - 'Makefile'
      - '.github/workflows/ruff.yml'

jobs:
  ruff-check:
    name: Ruff Format & Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      # 1. 检出代码（ruff 只检查工作区，不需要 git 历史）
      - name: Checkout repository
        uses: actions/checkout@v7

      # 2. 安装 uv（项目使用 uv 作为包管理器）
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.6"

      # 3. 设置 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install locked Ruff without runtime dependencies
        run: |
          RUFF_VERSION=$(python -c 'import tomllib; from pathlib import Path; print(next(p["version"] for p in tomllib.loads(Path("uv.lock").read_text())["package"] if p["name"] == "ruff"))')
          uv tool install --no-config --default-index https://pypi.org/simple "ruff==$RUFF_VERSION"

      - name: Check lint, formatting and imports
        run: |
          ruff check yuxi
          ruff format yuxi --check
          ruff check --select I yuxi
