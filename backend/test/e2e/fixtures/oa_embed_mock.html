<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OA S0 嵌入验收页</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        font:
          14px system-ui,
          sans-serif;
        background: #f5f6f8;
      }
      header {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 12px;
      }
      button,
      input {
        min-height: 32px;
      }
      input {
        width: 280px;
        padding: 0 8px;
      }
      #frame-shell {
        width: 400px;
        height: 720px;
        margin-left: auto;
        overflow: auto;
        background: white;
        border: 1px solid #ddd;
      }
      #frame-shell[data-mode="floating"] {
        position: fixed;
        right: 24px;
        bottom: 24px;
        z-index: 10;
        height: 640px;
        box-shadow: 0 12px 36px rgb(0 0 0 / 18%);
      }
      #frame-shell[data-mode="fullscreen"] {
        position: fixed;
        inset: 0;
        z-index: 10;
        width: 100vw;
        height: 100vh;
        border: 0;
      }
      iframe {
        width: 100%;
        height: 100%;
        border: 0;
      }
      pre {
        max-height: 180px;
        overflow: auto;
        padding: 8px;
        background: #111;
        color: #b7f7c3;
      }
    </style>
  </head>
  <body>
    <header>
      <label>Yuxi <input id="yuxi-base" value="http://127.0.0.1:5173" /></label>
      <label>OA account <input id="oa-account" placeholder="请输入真实 OA account" /></label>
      <button id="open" type="button">打开 AI 助手</button>
      <button id="login" type="button">重新发送 account</button>
    </header>
    <div id="frame-shell" data-mode="fixed" hidden>
      <iframe
        id="yuxi-frame"
        title="Yuxi OA 插件"
        sandbox="allow-scripts allow-same-origin allow-downloads allow-popups allow-popups-to-escape-sandbox"
      ></iframe>
    </div>
    <pre id="events" aria-live="polite"></pre>
    <script>
      const baseInput = document.querySelector("#yuxi-base");
      const accountInput = document.querySelector("#oa-account");
      const frame = document.querySelector("#yuxi-frame");
      const shell = document.querySelector("#frame-shell");
      const events = document.querySelector("#events");
      const modes = new Set(["fixed", "floating", "fullscreen"]);

      const base = () => baseInput.value.replace(/\/$/, "");
      const origin = () => new URL(base()).origin;
      const log = (value) => {
        events.textContent += `${new Date().toISOString()} ${value}\n`;
      };
      // 按正式 OA 插件协议下发账号；Yuxi 仅消费 userInfo.account，不应依赖父项目 token。
      const sendLoginParams = () => {
        const account = accountInput.value.trim();
        if (!account) {
          log("未填写 OA account");
          return;
        }
        frame.contentWindow.postMessage(
          {
            type: "login-params",
            data: {
              type: "login-params",
              userInfo: { account },
            },
          },
          origin(),
        );
        log("OA -> Yuxi: login-params");
      };
      const loadFrame = () => {
        frame.src = `${base()}/embed`;
      };
      const applyMode = (mode) => {
        if (!modes.has(mode)) return;
        shell.hidden = false;
        shell.dataset.mode = mode;
      };

      // 正式父插件只在子页 ready 后发送初始化消息，随后等待子页主动请求登录参数。
      const sendInitialMessages = () => {
        frame.contentWindow.postMessage(
          { type: "host-info", data: { viewport: { width: window.innerWidth, height: window.innerHeight } } },
          origin(),
        );
        frame.contentWindow.postMessage({ type: "initial-mode", mode: "embedded" }, origin());
        log("OA -> Yuxi: host-info, initial-mode (embedded)");
      };

      window.addEventListener("message", (event) => {
        if (event.source !== frame.contentWindow || event.origin !== origin())
          return;
        const message = event.data || {};
        log(
          `Yuxi -> OA: ${message.type}${message.threadId ? ` (${message.threadId})` : ""}`,
        );
        if (message.type === "ready") {
          applyMode("fixed");
          sendInitialMessages();
        }
        if (message.type === "request-login-params") sendLoginParams();
        if (message.type === "toggle-floating") {
          applyMode(message.data?.isFloating ? "floating" : "fixed");
        }
        if (message.type === "toggle-window-size") {
          applyMode(message.data?.isEnlarge ? "fullscreen" : "fixed");
        }
        if (message.type === "close") {
          shell.hidden = true;
        }
      });

      document.querySelector("#open").addEventListener("click", () => {
        if (!frame.getAttribute("src")) {
          loadFrame();
        }
        applyMode("fixed");
      });
      document
        .querySelector("#login")
        .addEventListener("click", sendLoginParams);
    </script>
  </body>
</html>
