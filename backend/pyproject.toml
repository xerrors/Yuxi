[project]
name = "yuxi"
version = "0.8.0.beta7"
description = "Yuxi 智能知识库与知识图谱平台核心后端包"
readme = "README.md"
license = { text = "MIT" }
classifiers = [
    "License :: OSI Approved :: MIT License",
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.121",
    "uvicorn[standard]>=0.34.2",
    "arq>=0.26.3",
    "croniter>=6.0.0",
    "cubesandbox==0.7.3",
    "aiofiles>=24.1.0",
    "aiohttp>=3.14.4",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.30.0",
    "dashscope>=1.23.2",
    "deepagents>=0.7.7,<0.8",
    "docling-slim[format-office,format-pdf-pypdfium2]==2.132.0",
    "pylatexenc>=2.10,<3",
    "pandas>=2.2.0",
    "chardet>=5.0.0",
    "httpx>=0.27.0",
    # SSRFGuardTransport 依赖 httpcore 的 pool network_backend 接线，
    # 显式约束兼容版本（httpx 0.28 本身也锁定 httpcore==1.0.*）
    "httpcore>=1.0.9,<1.1",
    "json-repair>=0.54.0",
    "langchain>=1.3.15",
    "langchain-core>=1.6.0",
    "langchain-mcp-adapters>=0.1.9",
    "langchain-openai>=1.0.2",
    "langfuse>=4.0.0",
    "langgraph>=1.2.14",
    "langgraph-checkpoint-postgres>=3.1.3",
    "langsmith>=0.4",
    "loguru>=0.7.3",
    "markdownify>=1.1.0",
    "mcp>=1.30,<2",
    "minio>=7.2.7",
    "neo4j>=5.28.1",
    "networkx>=3.5",
    "openai>=1.109",
    "onnxruntime>=1.20.0",
    "Pillow>=13.0.0",
    "psycopg[binary,pool]>=3.3.3",
    "pyjwt[crypto]>=2.13.0",
    "pymilvus==3.0.2",
    "pymysql>=1.1.0",
    "pypdf>=6.21.4",
    "pypdfium2>=5.0.0",
    "pypinyin>=0.55.0",
    "python-dotenv>=1.1.0",
    "python-multipart>=0.0.31",
    "pyyaml>=6.0.2",
    "xlrd>=2.0.1",
    "rapidocr>=3.9.0",
    "redis>=5.2.0",
    "requests>=2.34.0",
    "rich>=13.7.1",
    "sqlalchemy[asyncio]>=2.0.0",
    # Markdown 解析语义切分相关依赖
    "markdown-it-py>=3.0.0",
    "mdit-py-plugins>=0.4.0",
    "scikit-learn>=1.3.0",
    "beautifulsoup4>=4.12.0",
]


[tool.ruff]
line-length = 140  # 代码最大行宽
lint.select = [         # 选择的规则
    "F",
    "E",
    "W",
    "UP",
]

[tool.uv]
constraint-dependencies = [
    "langchain-anthropic>=1.6.0",
    "aiohttp>=3.14.4",
    "certifi>=2026.10.19",
    "opentelemetry-api>=1.45.1",
    "cryptography>=48.0.1",
    "langchain>=1.3.9",
    "langchain-anthropic>=1.4.6",
    "pyjwt>=2.13.0",
    "pyasn1>=0.6.5",
    "python-multipart>=0.0.31",
    "starlette>=1.3.1",
    "transformers>=5.10.0",
]

[tool.pytest.ini_options]
addopts = "-v --tb=short"
testpaths = ["test/unit", "test/integration", "test/e2e"]
pythonpath = ["."]
markers = [
    "unit: marks tests that run without live services",
    "auth: marks tests that require authentication",
    "slow: marks tests as slow",
    "integration: marks tests that exercise real service boundaries",
    "self_managed_resources: marks integration tests that manage their own resources without shared live API cleanup",
    "e2e: marks tests that exercise an end-to-end workflow"
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"


[dependency-groups]
dev = [
    "ruff>=0.12.1",
]
test = [
    "aiosqlite>=0.20.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-httpx>=0.32.0",
    "pytest-timeout>=2.4.0",
    "pytest-cov>=6.0.0",
]

[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["yuxi*"]
